<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="frame5"><rect x="0" y="0" width="960" height="600" rx="14"/></clipPath>
    <marker id="arrow5" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4d4947"/>
    </marker>
  </defs>
  <g clip-path="url(#frame5)">
    <rect width="960" height="600" fill="#0d0d0d"/>
    <rect width="960" height="40" fill="#1d1a18"/>
    <circle cx="24" cy="20" r="6" fill="#3d3a39"/>
    <circle cx="44" cy="20" r="6" fill="#3d3a39"/>
    <circle cx="64" cy="20" r="6" fill="#3d3a39"/>
    <text x="90" y="25" font-family="monospace" font-size="12" letter-spacing="1" fill="#b8b3b0">ONBOARDING.FLOW</text>

    <!-- orchestrator -->
    <g transform="translate(480,90)" text-anchor="middle">
      <path d="M0 -18 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 z" fill="#a0ca92"/>
      <text x="0" y="34" font-family="monospace" font-size="10" letter-spacing="1" fill="#8a8380">CLAUDE COWORK · ORQUESTRAÇÃO</text>
    </g>

    <!-- orchestrator connectors down -->
    <line x1="480" y1="128" x2="130" y2="205" stroke="#3d3a39" stroke-width="1"/>
    <line x1="480" y1="128" x2="360" y2="205" stroke="#3d3a39" stroke-width="1"/>
    <line x1="480" y1="128" x2="600" y2="205" stroke="#3d3a39" stroke-width="1"/>
    <line x1="480" y1="128" x2="830" y2="205" stroke="#3d3a39" stroke-width="1"/>

    <!-- node 1: Cadastro (pessoa) -->
    <g transform="translate(60,205)" text-anchor="middle">
      <circle cx="70" cy="35" r="32" fill="#1d1a18" stroke="#3d3a39"/>
      <circle cx="70" cy="24" r="8" fill="none" stroke="#eeeeee" stroke-width="2"/>
      <path d="M52 50 q18 -16 36 0" fill="none" stroke="#eeeeee" stroke-width="2" stroke-linecap="round"/>
      <text x="70" y="92" font-family="monospace" font-size="11" fill="#eeeeee">CADASTRO DO</text>
      <text x="70" y="108" font-family="monospace" font-size="11" fill="#eeeeee">CLIENTE</text>
      <path d="M56 128 l6 6 12 -14" stroke="#a0ca92" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- node 2: Movidesk (ticket) -->
    <g transform="translate(290,205)" text-anchor="middle">
      <circle cx="70" cy="35" r="32" fill="#1d1a18" stroke="#3d3a39"/>
      <path d="M52 22 h36 a4 4 0 0 1 4 4 v18 a4 4 0 0 1 -4 4 h-36 a4 4 0 0 1 -4 -4 v-18 a4 4 0 0 1 4 -4 z" fill="none" stroke="#eeeeee" stroke-width="2"/>
      <circle cx="70" cy="35" r="3" fill="none" stroke="#eeeeee" stroke-width="1.5"/>
      <text x="70" y="92" font-family="monospace" font-size="11" fill="#eeeeee">ABERTURA NO</text>
      <text x="70" y="108" font-family="monospace" font-size="11" fill="#eeeeee">MOVIDESK</text>
      <path d="M56 128 l6 6 12 -14" stroke="#a0ca92" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- node 3: Grupo WhatsApp -->
    <g transform="translate(520,205)" text-anchor="middle">
      <circle cx="70" cy="35" r="32" fill="#1d1a18" stroke="#3d3a39"/>
      <path d="M55 22 q0 -8 8 -8 h14 q8 0 8 8 v10 q0 8 -8 8 h-10 l-8 8 v-8 q-4 -2 -4 -8 z" fill="none" stroke="#a0ca92" stroke-width="2" stroke-linejoin="round"/>
      <text x="70" y="92" font-family="monospace" font-size="11" fill="#eeeeee">CRIAÇÃO DO GRUPO</text>
      <text x="70" y="108" font-family="monospace" font-size="11" fill="#eeeeee">WHATSAPP</text>
      <path d="M56 128 l6 6 12 -14" stroke="#a0ca92" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- node 4: Treinamento enviado (checklist) -->
    <g transform="translate(750,205)" text-anchor="middle">
      <circle cx="70" cy="35" r="32" fill="#eeeeee" stroke="#3d3a39"/>
      <g stroke="#101010" stroke-width="2" fill="none">
        <rect x="54" y="18" width="32" height="36" rx="3"/>
        <path d="M60 28 l3 3 6 -7"/>
        <line x1="72" y1="28" x2="80" y2="28"/>
        <path d="M60 40 l3 3 6 -7"/>
        <line x1="72" y1="40" x2="80" y2="40"/>
      </g>
      <text x="70" y="92" font-family="monospace" font-size="11" fill="#eeeeee">ENVIO DO</text>
      <text x="70" y="108" font-family="monospace" font-size="11" fill="#eeeeee">TREINAMENTO</text>
      <circle cx="94" cy="14" r="4" fill="#ee6018"/>
    </g>

    <!-- connectors between nodes -->
    <line x1="172" y1="240" x2="288" y2="240" stroke="#4d4947" stroke-width="2" marker-end="url(#arrow5)"/>
    <line x1="402" y1="240" x2="518" y2="240" stroke="#4d4947" stroke-width="2" marker-end="url(#arrow5)"/>
    <line x1="632" y1="240" x2="748" y2="240" stroke="#4d4947" stroke-width="2" marker-end="url(#arrow5)"/>

    <!-- caption -->
    <text x="480" y="400" font-family="monospace" font-size="10" fill="#8a8380" text-anchor="middle">
      DADOS DE CADASTRO → TICKET → GRUPO → ATENDIMENTO PERSONALIZADO
    </text>
  </g>
</svg>
