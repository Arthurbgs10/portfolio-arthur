<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="frame2"><rect x="0" y="0" width="960" height="600" rx="14"/></clipPath>
    <radialGradient id="portrait" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#bdbdbd"/>
      <stop offset="55%" stop-color="#4a4a4a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#frame2)">
    <rect width="960" height="600" fill="#0d0d0d"/>

    <!-- browser chrome (Factory frame) -->
    <rect width="960" height="40" fill="#1d1a18"/>
    <circle cx="24" cy="20" r="6" fill="#3d3a39"/>
    <circle cx="44" cy="20" r="6" fill="#3d3a39"/>
    <circle cx="64" cy="20" r="6" fill="#3d3a39"/>
    <rect x="380" y="12" width="200" height="16" rx="8" fill="#101010"/>

    <!-- site canvas: real brand is light cream, black & white photography -->
    <rect x="0" y="40" width="960" height="560" fill="#f5f2ec"/>

    <!-- nav -->
    <rect x="40" y="64" width="90" height="12" rx="2" fill="#0a0a0a"/>
    <rect x="720" y="66" width="50" height="8" rx="2" fill="#6b6b6b"/>
    <rect x="784" y="66" width="50" height="8" rx="2" fill="#6b6b6b"/>
    <rect x="848" y="66" width="72" height="8" rx="2" fill="#6b6b6b"/>

    <!-- grayscale portrait block -->
    <rect x="40" y="100" width="430" height="330" rx="8" fill="url(#portrait)"/>
    <ellipse cx="200" cy="300" rx="70" ry="110" fill="#0a0a0a" opacity="0.55"/>
    <ellipse cx="290" cy="300" rx="70" ry="110" fill="#0a0a0a" opacity="0.4"/>

    <!-- headline lines, editorial serif-like weight, black on cream -->
    <rect x="510" y="140" width="360" height="18" rx="2" fill="#0a0a0a"/>
    <rect x="510" y="170" width="300" height="18" rx="2" fill="#0a0a0a"/>
    <rect x="510" y="200" width="200" height="18" rx="2" fill="#6b6b6b"/>

    <rect x="510" y="248" width="240" height="12" rx="2" fill="#6b6b6b"/>
    <rect x="510" y="268" width="200" height="12" rx="2" fill="#6b6b6b"/>

    <rect x="510" y="310" width="150" height="34" rx="4" fill="#0a0a0a"/>
    <text x="585" y="332" font-family="monospace" font-size="10" fill="#f5f2ec" text-anchor="middle">WHATSAPP</text>

    <!-- masonry gallery row, true grayscale -->
    <rect x="40" y="452" width="190" height="108" rx="6" fill="#3a3a3a"/>
    <rect x="242" y="452" width="140" height="108" rx="6" fill="#c9c9c9"/>
    <rect x="394" y="452" width="230" height="108" rx="6" fill="#1c1c1c"/>
    <rect x="636" y="452" width="284" height="108" rx="6" fill="#8a8a8a"/>
  </g>
</svg>
