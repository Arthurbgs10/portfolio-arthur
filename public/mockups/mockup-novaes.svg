<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="frame1"><rect x="0" y="0" width="960" height="600" rx="14"/></clipPath>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3835"/>
      <stop offset="100%" stop-color="#1a1917"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#frame1)">
    <rect width="960" height="600" fill="#0d0d0d"/>

    <!-- browser chrome (Factory frame) -->
    <rect width="960" height="40" fill="#1d1a18"/>
    <circle cx="24" cy="20" r="6" fill="#3d3a39"/>
    <circle cx="44" cy="20" r="6" fill="#3d3a39"/>
    <circle cx="64" cy="20" r="6" fill="#3d3a39"/>
    <rect x="380" y="12" width="200" height="16" rx="8" fill="#101010"/>

    <!-- site canvas: real brand palette, cream background -->
    <rect x="0" y="40" width="960" height="560" fill="#faf8f4"/>

    <!-- site nav -->
    <rect x="40" y="64" width="110" height="12" rx="2" fill="#4a6b4e"/>
    <rect x="700" y="66" width="48" height="8" rx="2" fill="#34503a"/>
    <rect x="760" y="66" width="48" height="8" rx="2" fill="#34503a"/>
    <rect x="820" y="66" width="60" height="10" rx="5" fill="#4a6b4e"/>

    <!-- hero "photo" block: kitchen silhouette (real photos are graphite/black) -->
    <rect x="40" y="100" width="880" height="220" rx="8" fill="url(#counter)"/>
    <rect x="620" y="160" width="260" height="140" rx="4" fill="#101010" opacity="0.55"/>
    <rect x="640" y="180" width="80" height="90" rx="2" fill="#1d1a18"/>
    <rect x="730" y="180" width="80" height="90" rx="2" fill="#1d1a18"/>
    <!-- LED strip detail, soft green glow matching brand -->
    <rect x="640" y="272" width="170" height="4" rx="2" fill="#a8c2a8"/>

    <!-- headline overlay -->
    <rect x="72" y="150" width="280" height="16" rx="2" fill="#faf8f4"/>
    <rect x="72" y="176" width="190" height="12" rx="2" fill="#c9d9c9"/>
    <rect x="72" y="216" width="160" height="32" rx="4" fill="#4a6b4e"/>
    <text x="152" y="237" font-family="monospace" font-size="10" fill="#faf8f4" text-anchor="middle">ORÇAMENTO</text>

    <!-- stat row -->
    <g font-family="monospace" font-size="10" fill="#34503a">
      <rect x="40" y="344" width="204" height="72" rx="6" fill="none" stroke="#4a6b4e" stroke-width="1"/>
      <text x="56" y="368">PROJETOS</text>
      <text x="56" y="398" font-size="22" fill="#1f1e1c">+50</text>

      <rect x="264" y="344" width="204" height="72" rx="6" fill="none" stroke="#4a6b4e" stroke-width="1"/>
      <text x="280" y="368">ENTREGA</text>
      <text x="280" y="398" font-size="22" fill="#1f1e1c">30d</text>

      <rect x="488" y="344" width="204" height="72" rx="6" fill="none" stroke="#4a6b4e" stroke-width="1"/>
      <text x="504" y="368">PERSONALIZADO</text>
      <text x="504" y="398" font-size="22" fill="#1f1e1c">100%</text>

      <rect x="712" y="344" width="208" height="72" rx="6" fill="none" stroke="#4a6b4e" stroke-width="1"/>
      <text x="728" y="368">PARCELAS</text>
      <text x="728" y="398" font-size="22" fill="#1f1e1c">12x</text>
    </g>

    <!-- portfolio grid -->
    <rect x="40" y="440" width="280" height="120" rx="6" fill="#1a1917"/>
    <rect x="336" y="440" width="280" height="120" rx="6" fill="#4a6b4e"/>
    <rect x="632" y="440" width="288" height="120" rx="6" fill="#2e2c29"/>
  </g>
</svg>
